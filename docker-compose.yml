services:
  kafka:
    # Pinned by digest for the same reason as the API base image: a
    # tag can be repointed, so two deployments of this file would not
    # otherwise be guaranteed to run the same broker.
    image: apache/kafka@sha256:c89f315cff967322c5d2021434b32271393cb193aa7ec1d43e97341924e57069  # 3.8.0
    container_name: recommender-kafka
    ports:
      # Bound to loopback only, not every host interface: this broker
      # runs PLAINTEXT with no authentication at all (real SASL/TLS
      # would be the correct control for a shared or production
      # deployment, out of scope for this single-machine local/demo
      # stack). Binding to 127.0.0.1 means no other host on the network
      # can reach it regardless -- a real, disclosed mitigation, not a
      # silent gap.
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis@sha256:ff02b58f971e7d7d156a1267e283fcbbeee91773b6aa36c49dac28ecfe28eadf  # 7-alpine
    container_name: recommender-redis
    ports:
      - "127.0.0.1:6379:6379"
    # REDIS_PASSWORD, when set, is enforced here via --requirepass, so
    # config.py's redis_url_with_auth() actually has something real to
    # authenticate against. `--requirepass ""` (the default, unset
    # REDIS_PASSWORD case) is Redis's own documented way of leaving auth
    # disabled, so an empty or missing REDIS_PASSWORD keeps the default,
    # no-auth local/demo configuration.
    # appendonly yes: the default snapshot-only configuration can lose
    # the most recent writes on an abrupt kill, which breaks the claim
    # that streaming state survives a restart -- Kafka offsets may
    # already be committed for a write Redis then loses.
    #
    # appendfsync everysec is the documented trade: an fsync per
    # second rather than per write, bounding worst-case loss to about
    # one second of writes instead of eliminating it. `always` would
    # remove that window at a real throughput cost; this project
    # states the bound rather than claiming per-write durability.
    command:
      [
        "redis-server",
        "--requirepass", "${REDIS_PASSWORD:-}",
        "--appendonly", "yes",
        "--appendfsync", "everysec",
      ]
    volumes:
      # A named volume, so recent-feature records survive container
      # replacement rather than only a process restart. Combined with
      # AOF above this gives bounded durability -- up to about a second
      # of writes can still be lost on an abrupt kill, per the
      # appendfsync policy. Not per-write durability, and a volume
      # alone would not provide it.
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"${REDIS_PASSWORD:-}\" --no-auth-warning ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      # Real commit identity for a container with no .git directory at
      # all (recommender.tracking.experiment_log's repository-discovery
      # fallback only works for local development). Compose can't run a
      # shell command inline -- set GIT_COMMIT_SHA in the host
      # environment before building for this to carry a real value,
      # e.g.:
      #   GIT_COMMIT_SHA=$(git rev-parse HEAD) docker compose build api
      # Left unset, the image still builds fine; experiment_log simply
      # falls back to no commit identity at all inside the container
      # (matching today's prior behavior) rather than failing.
      args:
        GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-}
    container_name: recommender-api
    ports:
      # Loopback by default, matching kafka and redis above. This
      # service has no authentication, no TLS and no rate limiting --
      # it is a local demonstration, not an internet-facing
      # deployment -- so binding every interface would expose it to
      # anyone on the same network by default. Set API_BIND_HOST=0.0.0.0
      # deliberately to widen it.
      - "${API_BIND_HOST:-127.0.0.1}:${API_PORT:-8000}:${API_PORT:-8000}"
    environment:
      REDIS_URL: redis://redis:6379/0
      # A real REDIS_PASSWORD set in a local .env file is passed through
      # to this container's own environment here, so the app's Settings
      # actually see it. See docs/operations/configuration.md and .env.example.
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      API_PORT: ${API_PORT:-8000}
    volumes:
      # Trained model, index, ranking pipeline, and reserved splits --
      # gitignored local research output, never baked into the image.
      - ./data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
      # Not kafka: the live API never consumes from or produces to Kafka
      # at request time (only the offline replay and consumer scripts
      # do), so blocking API startup on Kafka's health would be an
      # unnecessary coupling -- found and removed while testing
      # what a Kafka interruption should and shouldn't affect.
    healthcheck:
      # No curl/wget in the slim base image -- urllib is already there.
      # /health is process liveness only (not /ready), matching what a
      # container orchestrator's own health probe should check: is this
      # process able to respond at all, not whether every dependency is
      # currently healthy.
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:${API_PORT:-8000}/health', timeout=3)\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  redis_data:
