services:
  kafka:
    image: apache/kafka:3.8.0
    container_name: recommender-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: recommender-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: recommender-api
    ports:
      - "${API_PORT:-8000}:${API_PORT:-8000}"
    environment:
      REDIS_URL: redis://redis:6379/0
      # REDIS_PASSWORD: set via a local .env file (gitignored), never here --
      # this repo has no real secret to carry yet, but the slot exists for
      # when it does. See docs/configuration.md and .env.example.
      API_PORT: ${API_PORT:-8000}
    volumes:
      # Trained model, index, ranking pipeline, and reserved splits --
      # gitignored local research output, never baked into the image.
      - ./data:/app/data:ro
    depends_on:
      redis:
        condition: service_healthy
      # Not kafka: the live API never consumes from or produces to Kafka
      # at request time (only the offline replay/consumer scripts from
      # Phase 6 do), so blocking API startup on Kafka's health would be
      # a real, unnecessary coupling -- found and removed while testing
      # what a Kafka interruption should and shouldn't affect.
