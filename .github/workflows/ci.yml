name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package with dev dependencies (flexible, lower-bound versions)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Test with coverage floor
        # A modest, real floor -- current coverage is ~64%; set below
        # that to leave headroom rather than chasing the number itself.
        # Meant to catch a real regression (a whole module losing its
        # tests), not to be raised just to look better; raise only when
        # real new coverage has actually landed.
        run: pytest -q --cov=recommender --cov-report=term-missing --cov-fail-under=60
      - name: Static security analysis
        run: bandit -r src/recommender -ll
      - name: Validate docker-compose.yml
        run: docker compose config >/dev/null

  locked-install-test:
    runs-on: ubuntu-latest
    # A second, separate install path from lint-and-test above:
    # requirements-lock.txt's exact, pinned versions, not
    # pyproject.toml's own flexible lower bounds. A dependency added to
    # pyproject.toml but never re-frozen into the lock file would
    # silently break a from-scratch locked install without either
    # install path in CI ever catching it -- lint-and-test's flexible
    # install always resolves a working set on its own, so it can't.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install exact locked dependencies
        run: pip install -r requirements-lock.txt
      - name: Install the project with no dependency resolution
        run: pip install --no-deps -e .
      - name: Test
        run: pytest -q
      # Audits the exact pinned versions installed above -- the set that
      # would actually ship -- rather than whatever a flexible resolve
      # happened to pick. Deliberately blocking, not advisory: a
      # dependency check that cannot fail the build reports nothing a
      # reader can rely on. This does mean a newly disclosed CVE in a
      # transitive dependency can break CI on a commit that changed
      # nothing related; that is the intended signal, and the fix is to
      # bump the dependency and re-freeze the lock file.
      #
      # This step exists because the check could not be run on the
      # maintainer's own machine: pip-audit queries PyPI's JSON API
      # directly rather than through pip, so pip's trusted-host settings
      # do not apply to it, and TLS interception there fails it with
      # SSLCertVerificationError even with certifi's CA bundle set
      # explicitly. CI has no such interception, so this is where the
      # check genuinely runs.
      #
      # Audits the environment installed above rather than passing
      # --requirement: with a requirements file pip-audit builds a second
      # throwaway virtualenv and re-resolves everything, while the steps
      # above have already installed exactly the locked set. --skip-editable
      # omits the project itself, which is installed from local source and
      # has no release on PyPI to have advisories against.
      - name: Audit locked dependencies for known vulnerabilities
        run: pip-audit --strict --skip-editable

  integration-smoke-test:
    runs-on: ubuntu-latest
    # Kafka and Redis are open-source images with no licensed data
    # involved, so this runs for real in CI. The trained model, the
    # Faiss index, and the ranking pipeline all depend on the licensed
    # MIND dataset (docs/dataset-source.md), which this project has
    # never redistributed and never will -- so the full API container
    # is verified locally, against the real data, not here. This job's
    # scope is exactly what's genuinely feasible in CI: a bounded,
    # real round-trip against the two services that don't need it.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install package with dev dependencies
        run: pip install -e ".[dev]"
      - name: Start Kafka and Redis
        run: docker compose up -d kafka redis
      - name: Wait for Kafka and Redis to report healthy
        run: |
          for i in $(seq 1 30); do
            kafka_status=$(docker inspect --format='{{.State.Health.Status}}' recommender-kafka)
            redis_status=$(docker inspect --format='{{.State.Health.Status}}' recommender-redis)
            if [ "$kafka_status" = "healthy" ] && [ "$redis_status" = "healthy" ]; then
              echo "both services healthy"
              exit 0
            fi
            sleep 2
          done
          echo "services never became healthy" >&2
          exit 1
      - name: Real Kafka produce/consume round trip
        run: python -m recommender.streaming.verify_connectivity
      - name: Real Redis round trip and latency
        run: python -m recommender.features.verify_state_store
      - name: Tear down
        if: always()
        run: docker compose down
